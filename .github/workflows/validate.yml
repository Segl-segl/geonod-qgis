name: Validate QGIS plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile plugin Python
        run: python -m compileall -q svenska_geodata_export
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build plugin ZIP
        run: python scripts/package_plugin.py
      - name: Validate package layout
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('dist/svenska-geodata-export.zip')
          assert archive.is_file()
          with ZipFile(archive) as zip_file:
              names = zip_file.namelist()
          assert names
          assert {name.split('/')[0] for name in names if name} == {'svenska_geodata_export'}
          assert 'svenska_geodata_export/metadata.txt' in names
          assert 'svenska_geodata_export/LICENSE' in names
          assert not any('/tests/' in name for name in names)
          assert not any('__pycache__' in name for name in names)
          assert not any(name.lower().endswith(('.pem', '.key', '.p12', '.pfx')) for name in names)
          print(f'Validated {archive} with {len(names)} files')
          PY
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: svenska-geodata-export-1.0.0
          path: dist/svenska-geodata-export.zip
          if-no-files-found: error
